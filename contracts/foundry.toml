# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config
[profile.default]
solc = "0.8.38"
auto_detect_solc = false
evm_version = "osaka"
optimizer = true
via_ir = true
optimizer_runs = 10000
bytecode_hash = "none"
allow_internal_expect_revert = true

src = "src"
test = "test"
out = "out"
script = "script"
fs_permissions = [{ access = "read", path = "./" }]
libs = ["dependencies"]
auto_detect_remappings = false
remappings = [
    "forge-std-1.17.0/=dependencies/forge-std-1.17.0/",
    "forge-std/=dependencies/forge-std-1.17.0/src/",
    "openzeppelin/contracts/=dependencies/risc0-risc0-ethereum-3.1.0/lib/openzeppelin-contracts/contracts/",
    "risc0-risc0-ethereum-3.1.0/=dependencies/risc0-risc0-ethereum-3.1.0/",
    "safe-smart-account-1.5.0/=dependencies/safe-smart-account-1.5.0/",
    "safe-smart-account/common/Enum.sol=dependencies/safe-smart-account-1.5.0/contracts/libraries/Enum.sol",
    "safe-smart-account/libraries/=dependencies/safe-smart-account-1.5.0/contracts/libraries/",
    "safe-utils-0.0.24/=dependencies/safe-utils-0.0.24/",
    "solidity-http/=dependencies/safe-utils-0.0.24/lib/solidity-http/src/",
]
ignored_warnings_from = [
    "dependencies/risc0-risc0-ethereum-3.1.0/contracts/src", # Warning 9170: Comparison of variables of contract type is deprecated
    "dependencies/safe-smart-account-1.5.0/contracts",       # Warning 6335: "error" will be promoted to keyword in the future and will not be allowed as an identifier anymore.
    "dependencies/safe-utils-0.0.24/lib/solidity-http/src/", # Warning 6335: "at" will be promoted to keyword in the future and will not be allowed as an identifier anymore.
]

[lint]
severity = ["high", "medium", "low", "info", "gas", "code-size"] # The default leaves out info, gas, and code-size.

[dependencies]
"forge-std" = "1.17.0"
"risc0-risc0-ethereum" = { version = "3.1.0", git = "https://github.com/risc0/risc0-ethereum.git", tag = "v3.1.0" }
"safe-smart-account" = { version = "1.5.0", git = "https://github.com/safe-global/safe-smart-account.git", tag = "v1.5.0" }
"safe-utils" = { version = "0.0.24", git = "https://github.com/Recon-Fuzz/safe-utils.git", tag = "v0.0.24" }

[soldeer]
recursive_deps = true
remappings_location = "config"
remappings_generate = true
remappings_version = true

[fuzz]
runs = 1_000

[profile.ci]
fuzz = { runs = 1_000 }
verbosity = 3

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
arbitrum-sepolia = "https://arb-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base-sepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimism = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimism-sepolia = "https://opt-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
bsc = "https://bnb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
tempo = "https://tempo-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
tempo-moderato = "https://tempo-moderato.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
monad = "https://monad-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
monad-testnet = "https://monad-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
stable-mainnet = "https://stable-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
megaeth = "https://megaeth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

localhost = "http://localhost:8545"
